<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Евгения Миланова — Дигитална визитка</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0c0b09;--surface:#161410;--raised:#1e1b16;--fg:#f3ede3;--muted:#9c9388;--faint:#6e675e;--line:#2c2822;--gold:#c4a574;--gold-soft:#e6d3b0;--ink:#0c0b09}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:radial-gradient(80% 50% at 50% -10%,rgb(196 165 116 / .09),transparent 55%),var(--bg)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:26rem;margin:0 auto;padding:1.25rem 1rem 2.5rem}
.top{display:flex;align-items:center;justify-content:space-between}
.kicker{font-size:.6875rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0}
.iconbtn{width:2.75rem;height:2.75rem;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.card{margin-top:1.25rem;background:var(--surface);border-radius:1.125rem;padding:2rem 1.5rem 1.5rem;box-shadow:0 40px 80px -28px rgb(0 0 0 / .65),0 0 0 1px rgb(196 165 116 / .1)}
.avatar{width:10rem;height:10rem;margin:0 auto;border-radius:999px;overflow:hidden;box-shadow:0 0 0 1px rgb(196 165 116 / .7),0 0 0 5px var(--surface)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.role{margin:1.75rem 0 0;text-align:center;font-size:.6875rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{margin:.5rem 0 0;text-align:center;font-size:1.85rem;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.loc{margin:.75rem 0 0;text-align:center;font-size:.875rem;color:var(--muted)}
.acts{margin-top:1.75rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.act{display:flex;flex-direction:column;align-items:center;gap:.5rem;font-size:.65rem;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.act i{width:3rem;height:3rem;border-radius:999px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center;color:var(--gold-soft)}
.act svg{width:1.25rem;height:1.25rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rows{margin-top:1.5rem;border:1px solid var(--line);border-radius:.75rem;background:rgb(30 27 22 / .6);padding:0 1rem}
.row{display:flex;align-items:center;gap:.5rem;padding:.9rem 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row a{flex:1;min-width:0}
.lbl{font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
.val{margin-top:.15rem;font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy{width:2.25rem;height:2.25rem;border-radius:999px;color:var(--faint)}
.btns{margin-top:1.25rem;display:flex;flex-direction:column;gap:.5rem}
.btn{height:3rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.875rem;font-weight:500}
.btn.primary{background:var(--fg);color:var(--ink)}
.btn.gold{border:1px solid rgb(196 165 116 / .4);background:rgb(196 165 116 / .1);color:var(--gold-soft)}
.btn.outline{border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.foot{margin-top:1.5rem;text-align:center;font-size:.75rem;letter-spacing:.04em;color:var(--faint)}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:end;background:rgb(12 11 9 / .7)}
.modal.on{display:grid}
.sheet{width:100%;max-width:26rem;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:1.125rem 1.125rem 0 0;padding:1.5rem}
.sheet h2{margin:0 0 1rem;font-size:1.125rem;font-weight:600}
.qrbox{width:14rem;height:14rem;margin:0 auto;background:#f3ede3;border-radius:.75rem;padding:.5rem;display:grid;place-items:center}
.qrbox img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);padding:.6rem 1rem;border-radius:.5rem;font-size:.8rem;display:none;z-index:60}
@media(min-width:480px){.modal.on{place-items:center}.sheet{border-radius:1.125rem}}
</style>
</head>

const $ = id => document.getElementById(id);
function toast(m){const el=$("toast");el.textContent=m;el.style.display="block";setTimeout(()=>el.style.display="none",1600)}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function fullBody(){
  const t=T[lang]; const url=location.href.split("#")[0];
  return t.mailBody+"\n"+(lang==="bg"?"Визитка: ":"Card: ")+url;
}
function gmailHref(){
  const t=T[lang]; const body=fullBody().replace(/\n/g,"\r\n");
  return "https://mail.google.com/mail/?view=cm&fs=1&tf=1&su="+encodeURIComponent(t.mailSub)+"&body="+encodeURIComponent(body);
}
function apply(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.name+" — "+(lang==="bg"?"Дигитална визитка":"Digital business card");
  document.querySelectorAll("[data-i]").forEach(el=>{const k=el.getAttribute("data-i"); if(t[k]) el.textContent=t[k]});
  $("langBtn").textContent = lang==="bg"?"EN":"BG";
  $("save").textContent=t.save;
  $("waAct").href="https://wa.me/?text="+encodeURIComponent(fullBody());
  $("mailAct").href=gmailHref();
  $("mailRow").href="https://mail.google.com/mail/?view=cm&fs=1&tf=1&to="+encodeURIComponent("evgeniya@milanovagroup.com");
}
async function shareNow(){
  const t=T[lang]; const text=fullBody();
  if (navigator.share){
    try{ await navigator.share({title:t.mailSub, text}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener,noreferrer");
}
function closeM(){$("modal").classList.remove("on")}
function openQr(){
  const t=T[lang]; const url=location.href.split("#")[0];
  const src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=8&data="+encodeURIComponent(url);
  $("sheet").innerHTML=`<h2>QR</h2><div class="qrbox"><img alt="QR" src="${src}"/></div><p style="color:var(--muted);font-size:.875rem;text-align:center;margin:1rem 0 0">${t.qrHint}</p>`;
  $("modal").classList.add("on");
}

$("shareTop").onclick=shareNow; $("share2").onclick=shareNow; $("qrBtn").onclick=openQr;
$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copy);toast(T[lang].copied)});
$("save").onclick=async(e)=>{
  e.preventDefault();
  const file=new File([VCF],"Evgeniya-Milanova.vcf",{type:"text/vcard"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Evgeniya Milanova"}); return; }
    catch(err){ if(err && err.name==="AbortError") return; }
  }
  if (isIOS()){ location.href=new URL("Evgeniya-Milanova.vcf", location.href).href; return; }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([VCF],{type:"text/vcard;charset=utf-8"}));
  a.download="Evgeniya-Milanova.vcf";
  document.body.appendChild(a); a.click(); a.remove();
  toast(T[lang].saved);
};
